# Namespace-scoped Role for Secret access.
# SNR only accesses the self-node-remediation-certificates secret in the operator's
# deployment namespace for mTLS peer health checks. Cluster-wide secret access is
# not required and would violate principle of least privilege.
#
# This Role must be bound via RoleBinding in the operator's namespace.
# OLM will promote this to cluster-scope in AllNamespaces install mode, but
# non-OLM deployments benefit from the namespace restriction.
#
# NOTE: Rules are split because resourceNames cannot restrict 'create' operations
# (Kubernetes limitation). Create permission is granted separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-secrets-role
rules:
# Create permission - resourceNames cannot be applied to create operations
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
# Get, list, and watch permissions - restricted to the specific certificate secret
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - self-node-remediation-certificates
  verbs:
  - get
  - list
  - watch
