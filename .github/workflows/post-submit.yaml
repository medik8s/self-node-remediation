name: Post Submit
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  push_to_registry:
    name: Build and push unversioned images to quay.io/medik8s
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Build and push the committed operator version with latest images
        # Keep the real CSV version; only the container tags use latest.
        run: >-
          make container-build-community container-push
          IMAGE_TAG=latest CONTAINER_TOOL=docker
